  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed
    params:
      - train.epochs
      - train.batch_size
      - train.learning_rate
      - train.units
      - train.dropout
      - train.seed
    outs:
      - models

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.h5
      - data/processed
    outs:
      - confusion_matrix.png
    metrics:
      - metrics.json:
          cache: false